<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reserva de citas</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <h1>Reserva de citas</h1>

  <h2>1. Registrar cliente</h2>
  <form id="formClient">
    <select id="type_document">
      <option value="CC">CC</option>
      <option value="TI">TI</option>
      <option value="CE">CE</option>
    </select>
    <input id="document" placeholder="Documento">
    <input id="c_name" placeholder="Nombre">
    <input id="address" placeholder="Dirección">
    <input id="phone" placeholder="Teléfono">
    <input id="email" placeholder="Correo">
    <button type="submit">Guardar cliente</button>
  </form>
  <p id="messageClient"></p>

  <h2>2. Reservar cita</h2>
  <form id="formReservation">
    <input id="client_id" placeholder="ID del cliente">
    <input id="name" placeholder="Nombre de la cita">
    <textarea id="description" placeholder="Descripción"></textarea>
    <button type="submit">Reservar</button>
  </form>
  <p id="message"></p>

  <h2>Reservas</h2>
  <ul id="list"></ul>

  <!-- El orden importa: primero model, luego controller, al final view -->
  <script src="model/client.js"></script>
  <script src="model/reservation.js"></script>
  <script src="controller/client.js"></script>
  <script src="controller/reservation.js"></script>
  <script src="view/client.js"></script>
  <script src="view/reservation.js"></script>
</body>
</html>
